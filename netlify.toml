# Netlify Configuration for Namami Enterprises
# https://namamienterprises.in
# Last Updated: May 2026

# ============================================
# BUILD SETTINGS
# ============================================
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NPM_FLAGS = "--include=dev"
  NODE_ENV = "production"

# ============================================
# PROCESSING (Performance Optimization)
# ============================================
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ============================================
# SECURITY HEADERS - Firebase & Cloudinary Compatible
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy (Cloudinary & Firebase explicit fallback)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://cdnjs.cloudflare.com; connect-src 'self' https://api.cloudinary.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google-analytics.com wss://*.firebaseio.com; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    
    # Fixes Cross-Origin-Opener-Policy console warnings for Firebase Popups
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    
    # Frame protection (Allow Firebase auth popups)
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # XSS Protection
    X-XSS-Protection = "1; mode=block"
    
    # Referrer Policy (Balance between privacy and analytics)
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions Policy (Privacy-focused)
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    
    # Strict Transport Security (HSTS) - Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ============================================
# CACHE OPTIMIZATION - Static Assets
# ============================================

# JavaScript & CSS - Long-term caching
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

# Images - Long-term caching
[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

# Fonts - Long-term caching
[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff"
    Access-Control-Allow-Origin = "*"

# HTML - No caching (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker - No caching
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest - Short caching
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# ============================================
# PRELOAD HEADERS (Critical Resources)
# ============================================

[[headers]]
  for = "/"
  [headers.values]
    Link = '''
      </assets/main.css>; rel=preload; as=style,
      </assets/main.js>; rel=preload; as=script,
      <https://fonts.googleapis.com>; rel=preconnect; crossorigin,
      <https://fonts.gstatic.com>; rel=preconnect; crossorigin
    '''

# ============================================
# REDIRECTS - SEO Critical (301 Permanent)
# ============================================

# HTTP to HTTPS (Force SSL)
[[redirects]]
  from = "http://namamienterprises.in/*"
  to = "https://namamienterprises.in/:splat"
  status = 301
  force = true

# WWW to non-WWW (Canonical URL)
[[redirects]]
  from = "https://www.namamienterprises.in/*"
  to = "https://namamienterprises.in/:splat"
  status = 301
  force = true

# HTTP + WWW to HTTPS non-WWW
[[redirects]]
  from = "http://www.namamienterprises.in/*"
  to = "https://namamienterprises.in/:splat"
  status = 301
  force = true

# ============================================
# SPA ROUTING (React Router) - MUST BE LAST
# ============================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200